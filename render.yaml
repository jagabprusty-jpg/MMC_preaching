services:
  - type: web
    name: student-outreach-system
    runtime: python
    plan: free
    buildCommand: pip install -r student-outreach/backend/requirements.txt
    startCommand: cd student-outreach/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
