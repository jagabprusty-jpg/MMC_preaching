<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantra Outreach - Student Meditation Management</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);color:#fff;min-height:100vh;">
  <div style="text-align:center;padding:24px;max-width:400px;">
    <div style="width:64px;height:64px;background:rgba(255,255,255,0.2);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:16px;">
      <i class="fas fa-om"></i>
    </div>
    <h1 style="color:#fff;font-size:1.6rem;margin-bottom:8px;">Mantra Outreach</h1>
    <p style="opacity:0.9;font-size:0.95rem;margin-bottom:24px;">Hostel Student Outreach & Meditation Management System</p>
    <div class="loading-spinner" style="border-color:rgba(255,255,255,0.3);border-top-color:#fff;width:32px;height:32px;"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Smart redirect based on existing session token
    const token = getToken();
    setTimeout(() => {
      if (token) {
        window.location.href = '/dashboard.html';
      } else {
        window.location.href = '/login.html';
      }
    }, 300);
  </script>
</body>
</html>
